# CodeRabbit Master Review Configuration — varunagarwal
# Reference: Docs/CodeRabbit.md
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
version: 2
language: "en-US"

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  sequence_diagrams: true
  changed_files_summary: true
  poem: false
  in_progress_fortune: false
  review_status: true
  enable_prompt_for_ai_agents: true

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"

  tools:
    markdownlint:
      enabled: true
    gitleaks:
      enabled: true

  path_instructions:
    - path: "**/*.md"
      instructions: |
        Ensure markdown links are valid, formatting follows GitHub Flavored Markdown (GFM),
        and UNIX LF line endings are preserved.

knowledge_base:
  web_search:
    enabled: true

chat:
  auto_reply: true

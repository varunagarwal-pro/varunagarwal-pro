# Reference: https://github.com/lowlighter/metrics/blob/master/action.yml
name: Metrics

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: varunagarwal-pro
          filename: assets/github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_display: large
          config_timezone: Asia/Kolkata
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%
          plugin_lines: yes
          plugin_stars: yes
          plugin_stars_limit: 4
          extras_css: |
            svg { font-size: 17px !important; }
            h1 { font-size: 24px !important; }
            h2 { font-size: 19px !important; }
            h3 { font-size: 17px !important; }
            .repository .description, .repository .infos { font-size: 15px !important; }
            .repository .name span:last-child { font-size: 12px !important; }
            footer { font-size: 12px !important; }

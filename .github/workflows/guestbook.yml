name: Guestbook

on:
  workflow_dispatch:
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: write

jobs:
  update_guestbook:
    name: Update guestbook
    if: ${{ github.event.issue.title == 'Guestbook 📖' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Update guestbook from comments
        uses: actions/github-script@v7
        with:
          script: |
            const updateGuestbook = require('./guestbook.js');
            await updateGuestbook({ github, context });

      - name: Push guestbook update
        run: |
          if git diff --quiet README.md; then
            echo "No guestbook changes to commit."
            exit 0
          fi
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'feat: update guestbook'
          git push
